name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  phase6-postgres-smoke:
    name: Phase 6 PostgreSQL smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PHASE6_SMOKE_DATABASE_URL: postgresql://researchweave:researchweave@localhost:5432/phase6_smoke
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: phase6_smoke
          POSTGRES_USER: researchweave
          POSTGRES_PASSWORD: researchweave
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U researchweave -d phase6_smoke"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Phase 6 smoke test
        run: npm run test:phase6:postgres

  phase7a-postgres-smoke:
    name: Phase 7A PostgreSQL smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PHASE7A_SMOKE_DATABASE_URL: postgresql://researchweave:researchweave@localhost:5432/phase7a_smoke
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: phase7a_smoke
          POSTGRES_USER: researchweave
          POSTGRES_PASSWORD: researchweave
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U researchweave -d phase7a_smoke"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Phase 7A smoke test
        run: npm run test:phase7a:postgres
