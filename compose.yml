services:
  database:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: researchweave
      POSTGRES_USER: researchweave
      POSTGRES_PASSWORD: researchweave
    ports:
      - "5432:5432"
    volumes:
      - researchweave_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U researchweave -d researchweave"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  researchweave_postgres_data:
